name: Build SideInstaller P12 Import
on:
  push:
    branches: [feature/import-existing-p12]
    paths:
      - ios-app/**
      - rust-core/**
      - tests/**
      - project.yml
      - .github/workflows/build-p12-import.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p12-import-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            ios-app
            ios-live-activity
            rust-core
            tests
      - name: Select latest installed Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add aarch64-apple-ios
          brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: p12-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: p12-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-core/Cargo.lock') }}-
      - name: Swift syntax lint
        run: swiftc -frontend -parse ios-app/P12Importer.swift ios-app/SigningKeychain.swift ios-app/P12ImportPresenter.swift ios-app/CertManager.swift ios-app/CertsView.swift
      - name: Swift iOS typecheck
        run: xcrun swiftc -swift-version 5 -typecheck -target arm64-apple-ios17.4 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -I rust-core/include ios-app/*.swift
      - name: Rust signing lint and typecheck
        working-directory: rust-core
        run: cargo clippy --locked --release --target aarch64-apple-ios --lib
      - name: Build Rust signing engine
        working-directory: rust-core
        run: cargo build --locked --release --target aarch64-apple-ios
      - name: Package FFI and generate Xcode project
        run: |
          xcodebuild -create-xcframework -library rust-core/target/aarch64-apple-ios/release/libsideinstaller_ffi.a -headers rust-core/include -output SideInstallerFFI.xcframework
          # Keep the shipped 1.5.2 identifiers used by the existing IPA signing
          # workflow. project.yml is an older template; it stays untouched.
          python3 - <<'PY'
          from pathlib import Path
          spec = Path("project.yml").read_text()
          spec = spec.replace("com.frizzle.sideinstaller", "com.frizzlem.sideinstaller")
          Path("project-p12.yml").write_text(spec)
          PY
          xcodegen generate --spec project-p12.yml
      - name: Build and typecheck iOS application
        run: |
          set -o pipefail
          xcodebuild -project SideInstaller.xcodeproj -scheme SideInstaller -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-p12 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION=1.5.2 CURRENT_PROJECT_VERSION=15201 build | tee "$RUNNER_TEMP/xcode-p12.log"
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build-p12/Build/Products/Release-iphoneos/SideInstaller.app package/Payload/
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path("package/Payload/SideInstaller.app")
          targets = [(app, "com.frizzlem.sideinstaller"), (app / "PlugIns/SideInstallerLiveActivity.appex", "com.frizzlem.sideinstaller.LiveActivity")]
          for target, expected in targets:
              info = plistlib.loads((target / "Info.plist").read_bytes())
              assert info["CFBundleIdentifier"] == expected, "Bundle ID mismatch"
              assert info["CFBundleShortVersionString"] == "1.5.2", "Version mismatch"
              print(target.name, info["CFBundleIdentifier"], info["CFBundleShortVersionString"])
          PY
          cd package
          zip -qry ../SideInstaller-P12Import.ipa Payload
          cd ..
          shasum -a 256 SideInstaller-P12Import.ipa > SideInstaller-P12Import.sha256
          unzip -tq SideInstaller-P12Import.ipa
          echo "Unsigned IPA built from commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-P12Import
          path: |
            SideInstaller-P12Import.ipa
            SideInstaller-P12Import.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: p12-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-core/Cargo.lock') }}-${{ github.sha }}

  identity-tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rust-core
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: p12-test-${{ runner.arch }}-${{ hashFiles('rust-core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: p12-test-${{ runner.arch }}-${{ hashFiles('rust-core/Cargo.lock') }}-
      - name: Test identity reuse, missing keys, team matching and local-only removal
        working-directory: rust-core
        run: cargo test --locked -p isideload --lib imported_identity_tests
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: p12-test-${{ runner.arch }}-${{ hashFiles('rust-core/Cargo.lock') }}-${{ github.sha }}

  native-import-tests:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            ios-app
            tests
      - name: Native PKCS12 import logic tests
        run: bash tests/test-p12-import.sh
